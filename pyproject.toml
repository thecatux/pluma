[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pluma"
version = "0.10.0"
description = "Aplicación de escritura Pluma"
requires-python = ">=3.10"
dependencies = ["PySide6"]

[project.optional-dependencies]
docx = ["python-docx"]

[project.scripts]
pluma = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.data-files]
assets = ["assets/*.ico", "assets/*.svg", "assets/LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]